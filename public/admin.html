<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Thống kê đánh giá sản phẩm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f8fafc;
      --card-bg: #ffffff; --text-color: #1e293b; --border-color: #e2e8f0;
    }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 950px; margin: 0 auto; padding: 30px 20px; background: var(--bg-color); color: var(--text-color); }
    
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center; z-index: 999;
    }
    .login-card { background: white; padding: 35px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .login-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #475569; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; outline: none; }
    .btn-login { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    #loginError { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
    .header h2 { margin: 0; font-size: 24px; }
    .btn-logout { background: #fee2e2; color: #991b1b; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); padding: 22px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
    .stat-title { font-size: 14px; color: #64748b; font-weight: 500; }
    .stat-num { font-size: 30px; font-weight: 700; margin: 8px 0 0 0; }

    .progress-wrap { background: var(--card-bg); padding: 22px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
    .progress-top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 10px; }
    .progress-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2563eb; border-radius: 6px; transition: width 0.6s ease; }

    .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: #f1f5f9; font-weight: 600; color: #475569; }
    
    /* Huy hiệu 5 mức độ */
    .badge-1 { background: #fee2e2; color: #991b1b; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-2 { background: #ffedd5; color: #9a3412; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-3 { background: #fef9c3; color: #854d0e; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-4 { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-5 { background: #d1fae5; color: #065f46; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="login-card">
      <h2>🔐 Đăng Nhập Quản Trị</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Tài khoản</label>
          <input type="text" id="username" required placeholder="Nhập username...">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" required placeholder="Nhập password...">
        </div>
        <button type="submit" class="btn-login">Đăng Nhập</button>
        <div id="loginError"></div>
      </form>
    </div>
  </div>

  <div class="header">
    <h2>📊 Bảng Quản Trị Thống Kê Đánh Giá</h2>
    <div>
      <a href="/" style="margin-right: 15px;">← Xem trang sản phẩm</a>
      <button class="btn-logout" onclick="logout()">Đăng xuất</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-title">Tổng đánh giá</div>
      <div class="stat-num" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Điểm trung bình</div>
      <div class="stat-num" style="color: #f59e0b;" id="avgScore">0/5 <i class="fas fa-star fs-5"></i></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Tỷ lệ hài lòng (4-5★)</div>
      <div class="stat-num" style="color: #10b981;" id="rateText">0%</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>Độ hài lòng chung của khách hàng</span>
      <span id="rateTextSub">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="rateBar" style="width: 0%;"></div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Khách hàng</th>
          <th>Mức độ đánh giá</th>
          <th>Nhận xét</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody id="reviewTable">
        <tr><td colspan="4" style="text-align:center; color: #64748b;">Đang tải dữ liệu...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('admin_logged_in') === 'true') {
        document.getElementById('loginOverlay').style.display = 'none';
        loadStats();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        localStorage.setItem('admin_logged_in', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
        loadStats();
      } else {
        errorEl.innerText = data.error || 'Đăng nhập thất bại!';
      }
    });

    function logout() {
      localStorage.removeItem('admin_logged_in');
      location.reload();
    }

    const ratingLabels = {
      1: '<span class="badge-1">😡 1. Rất không hài lòng</span>',
      2: '<span class="badge-2">🙁 2. Không hài lòng</span>',
      3: '<span class="badge-3">😐 3. Bình thường</span>',
      4: '<span class="badge-4">😊 4. Hài lòng</span>',
      5: '<span class="badge-5">🤩 5. Rất hài lòng</span>'
    };

    async function loadStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();

      document.getElementById('totalCount').innerText = data.total;
      document.getElementById('avgScore').innerHTML = data.avgScore + '/5 <i class="fas fa-star text-warning"></i>';
      document.getElementById('rateText').innerText = data.satisfactionRate + '%';
      document.getElementById('rateTextSub').innerText = data.satisfactionRate + '%';
      document.getElementById('rateBar').style.width = data.satisfactionRate + '%';

      const tbody = document.getElementById('reviewTable');
      if (data.reviews.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #64748b;">Chưa có đánh giá nào</td></tr>';
        return;
      }

      tbody.innerHTML = data.reviews.map(r => `
        <tr>
          <td><strong>${r.customer_name}</strong></td>
          <td>${ratingLabels[r.is_satisfied] || r.is_satisfied}</td>
          <td>${r.comment || '<em style="color: #94a3b8;">Không có nhận xét</em>'}</td>
          <td>${new Date(r.created_at).toLocaleString('vi-VN')}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
